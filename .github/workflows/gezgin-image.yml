# Gezgin: builds the frontend and the Go binary, then publishes the container image to
# ghcr.io/drs0me1/gezgin (tags: main and sha-<short>). Konsol pins the image by its digest.
name: Gezgin image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gezgin-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: "frontend/package.json"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"
      - name: Build the frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Build the binary
        run: |
          short="$(git rev-parse --short=8 HEAD)"
          echo "SHORT=$short" >> "$GITHUB_ENV"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o filebrowser \
            -ldflags "-s -w -X github.com/filebrowser/filebrowser/v2/version.Version=gezgin-$short -X github.com/filebrowser/filebrowser/v2/version.CommitSHA=$short" .
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/drs0me1/gezgin:main
            ghcr.io/drs0me1/gezgin:sha-${{ env.SHORT }}
          labels: |
            org.opencontainers.image.title=Gezgin
            org.opencontainers.image.source=https://github.com/drs0me1/gezgin
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
